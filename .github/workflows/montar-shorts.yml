name: Montar Shorts

# Monta en vídeo cada Short de contenido/youtube/shorts/datos/ que todavía no tenga su release
# «short-NN», y lo publica como release con el MP4 y la descripción (fuentes y atribución de
# imágenes). Ver contenido/youtube/AUTOMATIZACION.md.

on:
  push:
    branches: [main]
    paths:
      - "contenido/youtube/shorts/datos/**"
      - "herramientas/shorts/**"
      - ".github/workflows/montar-shorts.yml"
  schedule:
    # Cada día a las 10:30 UTC: monta lo pendiente y sigue subiendo a YouTube si el día anterior
    # se agotó la cuota de la API (unas 6 subidas al día).
    - cron: "30 10 * * *"
  workflow_dispatch:
    inputs:
      rehacer:
        description: "Shorts que volver a montar, separados por comas (por ejemplo 2,13,16). Vacío: solo los pendientes."
        required: false
        default: ""
      probar_subida:
        description: "Número de un Short para probar la subida a YouTube (queda privado y no se marca como subido)."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: montar-shorts
  cancel-in-progress: false

jobs:
  montar:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar ffmpeg y fuentes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core jq

      - name: Instalar dependencias
        run: pip install -r herramientas/shorts/requirements.txt

      # Voz de reserva por si el servicio de Microsoft rechaza edge-tts.
      - name: Descargar la voz de reserva (Piper)
        run: |
          python3 -m piper.download_voices es_ES-davefx-medium --download-dir "$RUNNER_TEMP/piper" \
            || echo "::warning::No se pudo descargar la voz de Piper"
          echo "SHORTS_PIPER_MODELO=$RUNNER_TEMP/piper/es_ES-davefx-medium.onnx" >> "$GITHUB_ENV"

      - name: Elegir los Shorts pendientes
        id: pendientes
        run: |
          for n in $(echo "${{ github.event.inputs.rehacer }}" | tr ',' ' '); do
            id=$(printf '%02d' "$((10#$n))")
            gh release delete "short-$id" --yes --cleanup-tag 2>/dev/null || true
          done
          lista=""
          for f in contenido/youtube/shorts/datos/*.json; do
            id=$(jq -r .id "$f")
            if ! gh release view "short-$id" >/dev/null 2>&1; then
              lista="$lista $f"
            fi
          done
          echo "Pendientes:${lista:- ninguno}"
          echo "lista=$lista" >> "$GITHUB_OUTPUT"

      - name: Montar y publicar
        if: steps.pendientes.outputs.lista != ''
        run: |
          fallos=0
          for f in ${{ steps.pendientes.outputs.lista }}; do
            id=$(jq -r .id "$f")
            titulo=$(jq -r .titulo "$f")
            if python3 herramientas/shorts/montar.py "$f" --salida salida; then
              gh release create "short-$id" "salida/$id.mp4" "salida/$id-descripcion.txt" \
                --title "Short $id · $titulo" --notes-file "salida/$id-descripcion.txt"
            else
              echo "::warning::No se pudo montar el Short $id"
              fallos=$((fallos + 1))
            fi
          done
          if [ "$fallos" -gt 0 ]; then
            echo "::error::$fallos Short(s) sin montar. Se reintentarán en la próxima ejecución."
            exit 1
          fi

      # Prueba de credenciales: sube un Short como privado, sin programar y sin marcarlo como subido.
      - name: Probar la subida a YouTube
        if: always() && github.event.inputs.probar_subida != ''
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          SHORTS_SOLO_PRIVADO: "1"
        run: |
          id=$(printf '%02d' "${{ github.event.inputs.probar_subida }}")
          mkdir -p prueba
          gh release download "short-$id" --dir prueba --clobber
          python3 herramientas/shorts/subir.py "contenido/youtube/shorts/datos/$id.json" \
            "prueba/$id.mp4" "prueba/$id-descripcion.txt"

      # Subida real. Necesita los secretos YT_CLIENT_ID, YT_CLIENT_SECRET y YT_REFRESH_TOKEN y la
      # variable del repositorio YT_SUBIR = si (ver contenido/youtube/SUBIR_A_YOUTUBE.md). Sube cada
      # Short con fecha cuya release aún no tenga enlace de YouTube, programado para su día, y anota
      # el enlace en la release.
      - name: Subir a YouTube
        if: always() && vars.YT_SUBIR == 'si'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          if [ -z "$YT_REFRESH_TOKEN" ]; then
            echo "::error::YT_SUBIR está activado pero faltan los secretos de YouTube."
            exit 1
          fi
          mkdir -p subida
          for f in contenido/youtube/shorts/datos/*.json; do
            id=$(jq -r .id "$f")
            [ "$(jq -r .publicacion "$f")" = "null" ] && continue
            notas=$(gh release view "short-$id" --json body -q .body 2>/dev/null) || continue
            echo "$notas" | grep -q "youtu.be/" && continue
            gh release download "short-$id" --dir subida --clobber
            set +e
            vid=$(python3 herramientas/shorts/subir.py "$f" "subida/$id.mp4" "subida/$id-descripcion.txt")
            codigo=$?
            set -e
            if [ "$codigo" -eq 3 ]; then
              echo "Cuota diaria agotada; se sigue mañana."
              break
            elif [ "$codigo" -ne 0 ]; then
              echo "::error::No se pudo subir el Short $id"
              exit 1
            fi
            if [ -n "$vid" ]; then
              printf '%s\n\nYouTube: https://youtu.be/%s\n' "$notas" "$vid" > "subida/$id-notas.txt"
              gh release edit "short-$id" --notes-file "subida/$id-notas.txt"
            fi
          done
